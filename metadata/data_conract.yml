version: "1.0"
dataset: "Stroke_Prediction_Dataset"
primary_key: "id"

columns:
  id:
    type: "integer"
    nullable: false
    unique: true
  gender:
    type: "string"
    nullable: false
    allowed: ["Male", "Female", "Other"]
  age:
    type: "float"
    nullable: false
    min: 0.0
    max: 120.0
  hypertension:
    type: "integer"
    nullable: false
    allowed: [0, 1]
  heart_disease:
    type: "integer"
    nullable: false
    allowed: [0, 1]
  ever_married:
    type: "string"
    nullable: false
    allowed: ["Yes", "No"]
  work_type:
    type: "string"
    nullable: false
  Residence_type:
    type: "string"
    nullable: false
    allowed: ["Urban", "Rural"]
  avg_glucose_level:
    type: "float"
    nullable: false
    min: 30.0
    max: 350.0
  bmi:
    type: "float"
    nullable: true
    min: 10.0
    max: 100.0
  smoking_status:
    type: "string"
    nullable: false
    allowed: ["formerly smoked", "never smoked", "smokes", "Unknown"]
  stroke:
    type: "integer"
    nullable: false
    allowed: [0, 1]

expectations:
  missing_bmi_tolerance_pct: 0.05
  expected_rows: 5110
  expected_columns: 12